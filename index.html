<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Azra — A Little Life, Little by Little</title>

<!-- Elegant serif for narrative text + handwriting font for the final signature -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ SCENE ============ -->
<main class="scene" id="scene">

  <!-- Sunset sky gradient (color animates slowly + brightens after growth) -->
  <div class="sky" id="sky"></div>

  <!-- Sun glow -->
  <div class="sun" id="sun"></div>

  <!-- Canvas: floating light particles, sakura petals, birds -->
  <canvas id="fx-canvas"></canvas>

  <!-- Rolling hill silhouette -->
  <div class="hill hill-back"></div>
  <div class="hill hill-front"></div>

  <!-- Grass blades, populated by JS -->
  <div class="grass" id="grass"></div>

  <!-- The tree itself -->
  <div class="tree-wrap">
    <svg id="tree-svg" viewBox="0 0 800 900" preserveAspectRatio="xMidYMax meet" aria-label="A dry tree waiting to be watered">
      <defs>
        <!-- soft glow filter reused by roots / buds / sparkles -->
        <filter id="soft-glow" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="6" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>

        <radialGradient id="root-glow-grad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe9c7" stop-opacity="0.9"/>
          <stop offset="100%" stop-color="#ffe9c7" stop-opacity="0"/>
        </radialGradient>

        <linearGradient id="trunk-grad" x1="0" y1="0" x2="1" y2="0">
          <stop id="trunk-stop-1" offset="0%" stop-color="#4a3b32"/>
          <stop id="trunk-stop-2" offset="100%" stop-color="#2e241d"/>
        </linearGradient>
      </defs>

      <!-- glow that blooms at the roots when watered -->
      <circle id="root-glow" cx="400" cy="760" r="10" fill="url(#root-glow-grad)" opacity="0"/>

      <!-- trunk + branches (drawn in script.js-friendly static markup, classed for animation) -->
      <g id="tree-body">
        <path id="trunk" class="trunk" d="M385,760 C378,660 372,560 380,470 C384,420 392,380 400,340
                                            C408,380 416,420 420,470 C428,560 422,660 415,760 Z"/>
        <path id="branch-1" class="branch" d="M398,420 C360,390 320,370 270,365"/>
        <path id="branch-2" class="branch" d="M402,400 C440,365 485,345 535,340"/>
        <path id="branch-3" class="branch" d="M400,360 C375,320 350,285 320,255"/>
        <path id="branch-4" class="branch" d="M402,355 C428,315 458,282 495,255"/>
        <path id="branch-5" class="branch" d="M400,345 C400,300 400,255 400,210"/>
        <path id="branch-6" class="branch" d="M395,390 C350,375 305,375 265,392"/>
        <path id="branch-7" class="branch" d="M406,390 C452,377 497,378 538,396"/>
      </g>

      <!-- buds appear here before leaves -->
      <g id="buds-group"></g>

      <!-- leaves are generated by script.js, arranged to form a heart -->
      <g id="leaves-group"></g>

      <!-- sparkles around the tree -->
      <g id="sparkle-group"></g>
    </svg>
  </div>

  <!-- water flowing from button to roots -->
  <div class="water-stream" id="water-stream"></div>

  <!-- the call to action -->
  <button class="glass-btn" id="water-btn" aria-label="Fill the tree with love">
    <span class="drop">💧</span> Fill the Tree with Love
  </button>

  <!-- narrative text, revealed after the tree comes alive -->
  <div class="story" id="story">
    <p class="story-line story-line-1" id="line1">Love doesn't change the world in a single moment&hellip;</p>
    <p class="story-line story-line-2" id="line2">It brings life back, little by little.</p>
    <p class="story-line story-line-big" id="line3">Just like you did to my heart. <span class="heart-emoji">❤️</span></p>
    <p class="signature" id="signature">For Azra</p>
  </div>

  <!-- music toggle -->
  <button class="music-btn" id="music-btn" aria-label="Toggle music" aria-pressed="false">
    <span id="music-icon">♪</span>
  </button>

  <div class="hint" id="hint">tap a heart-shaped leaf ✨</div>

  <!-- Background music. Put your mp3 file next to index.html and
       name it "music.mp3" — or change the src below to match your
       filename (e.g. "assets/piano.mp3"). -->
  <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>

</main>

<script src="script.js"></script>
</body>
</html>
